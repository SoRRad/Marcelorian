<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <title>Marcelorian</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Marcelorian</a>
    <span class="slogan">{{ slogan }}</span>
    {% block nav %}{% set path = request.url.path if request else "" %}<nav class="mainnav">
      <a href="/" class="{{ 'current' if path == '/' or path.startswith('/candidates') or path.startswith('/campaigns') or path.startswith('/tasks') else '' }}">Home</a>
      <a href="/research" class="{{ 'current' if path.startswith('/research') else '' }}">Leads</a>
      <a href="/approvals" class="{{ 'current' if path.startswith('/approvals') or path.startswith('/messages') or path.startswith('/handoffs') else '' }}">Emails</a>
      <a href="/settings" class="{{ 'current' if path.startswith('/settings') or path.startswith('/profile') or path.startswith('/data') else '' }}">Settings</a>
    </nav>{% endblock %}
  </header>
  {% if csrf_token %}<div id="notices" class="notices" hidden aria-live="polite"></div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
