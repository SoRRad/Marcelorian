<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <title>Marcelorian</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Marcelorian</span>
    <span class="slogan">{{ slogan }}</span>
    {% block nav %}<nav class="mainnav">
      <a href="/">Dashboard</a>
      <a href="/profile">Profile</a>
      <a href="/research">Research</a>
      <a href="/research/queue">Verify</a>
      <a href="/candidates">Candidates</a>
      <a href="/approvals">Approvals</a>
      <a href="/tasks">Tasks</a>
      <a href="/settings">Settings</a>
    </nav>{% endblock %}
  </header>
  {% if csrf_token %}<div id="notices" class="notices" hidden aria-live="polite"></div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
