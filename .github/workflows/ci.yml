# Marcelorian CI - tests only (decision A4).
#
# * No secrets, no live service calls, read-only repository permissions.
# * Ubuntu and Windows jobs; superseded runs are cancelled; jobs time out.
# * The tester zip is built by package.yml; here Windows only checks that it builds.
# * Triggers are deliberately limited to pull requests into main and manual runs.
#   Before relying on this workflow, the owner checks the account's current
#   GitHub Actions billing and allowance (public vs private repository,
#   Windows runner rates). This file never enables overages or changes budgets.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Packaging smoke test (builds and self-tests the zip; nothing is published)
        if: runner.os == 'Windows'
        shell: bash
        run: python packaging/build_zip.py --version v0.0.0-ci

  browser:
    # Real-browser walkthrough of the tester guide (tests/e2e). Unit tests set headers by
    # hand; this catches what only a browser does (it found the "Origin: null" form bug).
    name: browser walkthrough (chromium)
    # Pinned: Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements/lock.txt
          python -m pip install --no-deps -e .
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Walkthrough
        env:
          MARCELORIAN_E2E: "1"
        run: python -m pytest tests/e2e -q
